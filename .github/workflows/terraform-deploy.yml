name: Terraform deployment
on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
  workflow_dispatch:
    inputs:
      plan_run_id:
        description: 'Leave empty to plan. To apply, enter the successful plan workflow run ID (expires in 24 hours).'
        type: string
        required: false
permissions:
  contents: read
  actions: read
  security-events: read
  deployments: read
concurrency:
  group: terraform-production
  cancel-in-progress: false
env:
  TF_IN_AUTOMATION: 'true'
  TF_INPUT: 'false'
  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
  TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
  TF_STATE_KMS_KEY_ARN: ${{ vars.TF_STATE_KMS_KEY_ARN }}
  TF_RUNTIME_BOUNDARY_ARN: ${{ vars.TF_RUNTIME_BOUNDARY_ARN }}
  TF_SERVICE_KMS_KEY_ARN: ${{ vars.TF_SERVICE_KMS_KEY_ARN }}
  TF_VAR_aws_account_id: ${{ vars.AWS_ACCOUNT_ID }}
  TF_VAR_runtime_boundary_arn: ${{ vars.TF_RUNTIME_BOUNDARY_ARN }}
  TF_VAR_service_kms_key_arn: ${{ vars.TF_SERVICE_KMS_KEY_ARN }}
jobs:
  verify:
    name: Verify deployment request
    if: >-
      (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success') &&
      vars.TF_PLAN_ROLE_ARN != '' && vars.TF_APPLY_ROLE_ARN != '' && vars.TF_STATE_BUCKET != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      mode: ${{ steps.request.outputs.mode }}
      sha: ${{ steps.request.outputs.sha }}
      plan_run_id: ${{ steps.request.outputs.plan_run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - id: request
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/terraform-release.mjs resolve

  plan:
    name: Plan production infrastructure
    needs: verify
    if: needs.verify.outputs.mode == 'plan'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - run: npm ci --prefix aws-leaderboard
      - run: npm run build --prefix aws-leaderboard
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.TF_PLAN_ROLE_ARN }}
          aws-region: us-east-1
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          role-session-name: firefly-plan-${{ github.run_id }}
      - name: Initialize locked remote state
        working-directory: infrastructure/leaderboard
        run: >-
          terraform init -lockfile=readonly
          -backend-config="bucket=$TF_STATE_BUCKET"
          -backend-config="key=leaderboard/production.tfstate"
          -backend-config="region=us-east-1"
          -backend-config="encrypt=true"
          -backend-config="use_lockfile=true"
          -backend-config="kms_key_id=$TF_STATE_KMS_KEY_ARN"
      - name: Create a saved plan
        working-directory: infrastructure/leaderboard
        run: |
          terraform plan -lock-timeout=5m -out=production.tfplan
          terraform show -no-color production.tfplan > plan.txt
          echo '## Production Terraform plan' >> "$GITHUB_STEP_SUMMARY"
          echo 'Review the terraform-production-plan artifact. Apply this exact saved plan by dispatching this workflow with this run ID. No resources were changed.' >> "$GITHUB_STEP_SUMMARY"
          echo "Plan run ID: $GITHUB_RUN_ID" >> "$GITHUB_STEP_SUMMARY"
      - name: Bind the plan to its source and package
        run: node scripts/terraform-release.mjs manifest
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: terraform-production-plan
          path: |
            infrastructure/leaderboard/production.tfplan
            infrastructure/leaderboard/plan.txt
            infrastructure/leaderboard/manifest.json
            infrastructure/leaderboard/build/lambda.zip
          retention-days: 1
          if-no-files-found: error

  apply:
    name: Apply reviewed production plan
    needs: verify
    if: needs.verify.outputs.mode == 'apply' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    permissions:
      contents: read
      actions: read
      security-events: read
      id-token: write
    outputs:
      api_url: ${{ steps.endpoint.outputs.api_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: terraform-production-plan
          path: infrastructure/leaderboard
          run-id: ${{ needs.verify.outputs.plan_run_id }}
          github-token: ${{ github.token }}
      - name: Verify plan integrity, freshness, CI and account
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/terraform-release.mjs verify
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.TF_APPLY_ROLE_ARN }}
          aws-region: us-east-1
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          role-session-name: firefly-apply-${{ github.run_id }}
      - name: Initialize the same state backend
        working-directory: infrastructure/leaderboard
        run: >-
          terraform init -lockfile=readonly
          -backend-config="bucket=$TF_STATE_BUCKET"
          -backend-config="key=leaderboard/production.tfstate"
          -backend-config="region=us-east-1"
          -backend-config="encrypt=true"
          -backend-config="use_lockfile=true"
          -backend-config="kms_key_id=$TF_STATE_KMS_KEY_ARN"
      - name: Apply only the saved plan
        working-directory: infrastructure/leaderboard
        run: terraform apply -lock-timeout=5m production.tfplan
      - name: Verify deployed API and generate app configuration
        id: endpoint
        run: |
          API_URL="$(terraform -chdir=infrastructure/leaderboard output -raw api_url)"
          node scripts/configure-leaderboard.mjs "$API_URL"
          echo "api_url=$API_URL" >> "$GITHUB_OUTPUT"
          echo "Leaderboard API: $API_URL" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deployed-leaderboard-config
          path: web/leaderboard-config.js
          retention-days: 14

  android:
    name: Build APK for deployed API
    needs: apply
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: deployed-leaderboard-config
          path: web
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: true
      - name: Install Android SDK 36
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"'
      - name: Build the connected APK
        run: ./android/gradlew --no-daemon --console=plain -p android assembleDebug lintDebug
      - name: Verify APK signature
        run: '"$ANDROID_HOME/build-tools/36.0.0/apksigner" verify android/app/build/outputs/apk/debug/app-debug.apk'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: firefly-grove-connected-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
