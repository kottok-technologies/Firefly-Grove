name: Signed Android release
on:
  workflow_dispatch: null
  workflow_call: null
permissions:
  contents: read
concurrency:
  group: android-release
  cancel-in-progress: false
jobs:
  android:
    name: Build signed APK and Play bundle
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6
        with:
          cache-read-only: true
      - name: Install Android SDK 36
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36"
          "build-tools;36.0.0"'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
      - name: Verify deployed API and configure app
        env:
          LEADERBOARD_API_URL: ${{ vars.LEADERBOARD_API_URL }}
        run: node scripts/configure-leaderboard.mjs "$LEADERBOARD_API_URL"
      - name: Prepare persistent signing key
        run: node scripts/android-signing.mjs prepare
      - name: Build the connected APK
        run: ./android/gradlew --no-daemon --console=plain -p android assembleRelease
          bundleRelease lintRelease
      - name: Verify APK signature
        run: node scripts/android-signing.mjs verify
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: firefly-grove-connected-apk
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 14
      - name: Remove runner signing key
        if: always()
        run: node scripts/android-signing.mjs clean
    if: github.ref == 'refs/heads/main'
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ANDROID_CERT_SHA256: ${{ vars.ANDROID_CERT_SHA256 }}
      ANDROID_PLAY_GAMES_PROJECT_ID: ${{ vars.PLAY_GAMES_PROJECT_ID }}
