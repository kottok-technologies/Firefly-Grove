version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directories: ['/', '/aws-leaderboard']
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: gradle
    directory: /android
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: terraform
    directories: ['/infrastructure/bootstrap', '/infrastructure/leaderboard']
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
